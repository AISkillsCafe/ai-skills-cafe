name: Removal or correction request
description: Ask for a skill or tool to be removed from AI Skills Café, or for its details to be corrected.
title: "[Removal] "
labels: ["removal-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for getting in touch, and sorry for any trouble. You didn't ask to be listed, so removal is simple:
        requests from authors are handled within 7 days, and removed items stay off the menu.
        Please don't include private information — this page is public.
        Prefer to ask privately? Email removals@aiskillscafe.com instead.
  - type: dropdown
    id: kind
    attributes:
      label: What would you like?
      options:
        - Remove it from the site
        - Correct its details
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Skill or tool name
      placeholder: e.g. my-skill
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source link (optional)
      description: The GitHub repository or registry page it comes from, if you have it handy.
      placeholder: https://github.com/owner/repo
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Anything else?
      description: Your connection to it (e.g. "I'm the author") and, for corrections, what should change.
