name: Nightly menu update

on:
  schedule:
    - cron: "23 6 * * *"   # every day at 06:23 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: nightly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build skills and tools data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site/data site/skill site/tool site/tools site/sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Nightly menu update"
            git push
          fi
